<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Добро пожаловать</title>
    <style>
        body {
            background-color: #2c2f33;
            margin: 0;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
        }

        .container {
            background-color: #333;
            padding: 70px;
            border-radius: 20px;
            text-align: center;
            width: 150%;
            max-width: 500px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.5);
        }

        h1 {
            margin-bottom: 30px;
        }

        a {
            display: block;
            width: 80%;
            margin: 14px auto;
            padding: 14px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 6px;
            text-decoration: none;
            font-size: 18px;
            cursor: pointer;
        }

        a:hover {
            background-color: #45a049;
        }

    </style>
</head>
<body>
    <div class="container">
        <h1>Для просмотра каталога войдите или зарегистрируйтесь</h1>
        <a href="{{ url_for('login') }}">Войти</a>
        <a href="{{ url_for('register') }}">Зарегистрироваться</a>
    </div>
</body>
</html>
